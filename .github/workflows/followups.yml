name: RecruitIQ Follow-ups

on:
  schedule:
    - cron: '0 9 * * 1-5'   # 9AM UTC, Mon-Fri — adjust the hour for your timezone
  workflow_dispatch: {}

jobs:
  followups:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: scripts
    env:
      NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
      NIM_MODEL: ${{ vars.NIM_MODEL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      YOUR_NAME: ${{ vars.YOUR_NAME }}
      YOUR_EMAIL: ${{ vars.YOUR_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node send-followups.js
