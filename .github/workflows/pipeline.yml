name: RecruitIQ Pipeline

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 350     # stay under GitHub's 6h free-tier job limit
    defaults:
      run:
        working-directory: scripts
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
      NIM_MODEL: ${{ vars.NIM_MODEL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
      MIN_RELEVANCE_SCORE: ${{ vars.MIN_RELEVANCE_SCORE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Discover jobs (Multi-Source API)
        run: node discover-jobs.js

      - name: Score jobs (Gemini)
        run: node score-jobs.js

      - name: Find contacts (Hunter.io)
        run: node find-contacts.js

      - name: Generate emails (Gemini RAG + NVIDIA NIM writing)
        run: node generate-emails.js

      # Sending is handled by its own workflow (send-emails.yml), which fires
      # every ~20 min during business hours and sends AT MOST one email per
      # run. That keeps each job short instead of one long job sleeping
      # between sends for hours.
